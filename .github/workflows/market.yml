# Monthly prices for Commodity Radar (World Bank Pink Sheet), added 11 Nov 2026.
# Runs every day; market.py commits only when the World Bank has published a new month.
name: Market prices
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - run: |
          git config user.name "commodity-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python market.py --push
